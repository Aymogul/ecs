name: Terraform CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_app_image: ${{ vars.APP_IMAGE }}
  TF_VAR_temporal_cloud_address: ${{ vars.TEMPORAL_CLOUD_ADDRESS }}
  TF_VAR_temporal_cloud_namespace: ${{ vars.TEMPORAL_CLOUD_NAMESPACE }}
  TF_VAR_temporal_cloud_api_key: ${{ secrets.TEMPORAL_CLOUD_API_KEY }}

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate -no-color

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}

    permissions:
      contents: read
      id-token: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify staging configuration
        env:
          APP_IMAGE: ${{ vars.APP_IMAGE }}
          TEMPORAL_CLOUD_ADDRESS: ${{ vars.TEMPORAL_CLOUD_ADDRESS }}
          TEMPORAL_CLOUD_NAMESPACE: ${{ vars.TEMPORAL_CLOUD_NAMESPACE }}
          TEMPORAL_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLOUD_API_KEY }}
        run: |
          test -n "$APP_IMAGE" || { echo "Missing GitHub Actions variable: APP_IMAGE"; exit 1; }
          test -n "$TEMPORAL_CLOUD_ADDRESS" || { echo "Missing GitHub Actions variable: TEMPORAL_CLOUD_ADDRESS"; exit 1; }
          test -n "$TEMPORAL_CLOUD_NAMESPACE" || { echo "Missing GitHub Actions variable: TEMPORAL_CLOUD_NAMESPACE"; exit 1; }
          test -n "$TEMPORAL_CLOUD_API_KEY" || { echo "Missing GitHub Actions secret: TEMPORAL_CLOUD_API_KEY"; exit 1; }

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -no-color -input=false
