services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aster
      POSTGRES_PASSWORD: aster
      POSTGRES_DB: aster_app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aster -d aster_app"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.29.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: aster
      POSTGRES_PWD: aster
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig

  temporal-ui:
    image: temporalio/ui:2.38.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8000
    ports:
      - "8080:8080"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      APP_NAME: Aster Studio
      DATABASE_URL: postgresql://aster:aster@postgres:5432/aster_app
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TLS: "false"
      TASK_QUEUE: aster-orders
      DEMO_FAIL_FIRST_PAYMENT: "true"
      RECENT_ORDERS_LIMIT: "8"
    ports:
      - "8000:8000"

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    command: ["python", "-m", "app.worker"]
    environment:
      APP_NAME: Aster Studio
      DATABASE_URL: postgresql://aster:aster@postgres:5432/aster_app
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TLS: "false"
      TASK_QUEUE: aster-orders
      DEMO_FAIL_FIRST_PAYMENT: "true"

volumes:
  postgres-data:
